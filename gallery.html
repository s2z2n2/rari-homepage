<style>
  :root{
    --cream:#FFF9F2; --cream-soft:#FBF1E6;
    --blush:#FFD1E7; --pink:#FF4F9A; --pink-soft:#FFEAF3;
    --gold:#C79A56; --gold-deep:#9C7A3E; --ink:#3B322C; --ink-soft:#7A6E64;
    --white:#FFFFFF; --border:#F5DCE7;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased;}

  a{text-decoration:none;color:inherit;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 32px;}
  section{padding:96px 0;}

  header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,249,242,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:76px;}
  .logo{font-size:22px;font-weight:700;letter-spacing:1px;color:var(--gold-deep);}
  .logo-img{height:40px;display:block;}
  nav ul{display:flex;gap:26px;list-style:none;}
  nav a{font-size:14.5px;color:var(--ink);font-weight:500;white-space:nowrap;}
  nav a:hover, nav a.active{color:var(--pink);}
  .nav-cta{background:var(--pink);color:var(--white)!important;padding:10px 22px;border-radius:24px;font-size:14px;font-weight:700;}
  .nav-cta:hover{background:#E23F88;}
  .nav-toggle{display:none;background:none;border:none;font-size:26px;line-height:1;cursor:pointer;color:var(--ink);padding:4px 6px;}

  .img-placeholder{background:linear-gradient(135deg,var(--pink-soft),var(--blush));border:1.5px dashed var(--pink);border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--gold-deep);font-size:14px;font-weight:700;text-align:center;}

  .eyebrow{font-size:13px;letter-spacing:3px;font-weight:700;color:var(--gold-deep);text-transform:uppercase;margin-bottom:14px;}
  .section-title{font-size:32px;font-weight:700;margin-bottom:18px;color:var(--ink);}
  .section-desc{font-size:15.5px;color:var(--ink-soft);max-width:560px;}
  .center{text-align:center;margin-left:auto;margin-right:auto;}

  .page-hero{padding:168px 0 64px;background:linear-gradient(180deg,var(--pink-soft),var(--cream));text-align:center;}

  .gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:220px;gap:20px;margin-top:56px;}
  .gallery-grid > div{height:100%;width:100%;overflow:hidden;border-radius:14px;}
  .gallery-grid img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease;}
  .gallery-grid > div:hover img{transform:scale(1.05);}
  .gallery-grid > div:nth-child(1){grid-column:span 2;grid-row:span 2;}

  .gallery-grid video{width:100%;height:100%;object-fit:cover;display:block;}
  .gallery-grid > div{cursor:zoom-in;}
  .gallery-grid > div.hidden{display:none;}
  .more-wrap{text-align:center;margin-top:40px;}
  .more-btn{background:var(--pink);color:#fff;border:none;border-radius:30px;padding:14px 40px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(255,79,154,0.2);}
  .lightbox{position:fixed;inset:0;background:rgba(20,14,10,0.9);display:none;align-items:center;justify-content:center;z-index:9999;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:92vw;max-height:88vh;border-radius:8px;}
  .lightbox button{position:absolute;background:none;border:none;color:#fff;font-size:40px;cursor:pointer;padding:10px 18px;}
  .lb-close{top:14px;right:14px;} .lb-prev{left:6px;top:50%;transform:translateY(-50%);} .lb-next{right:6px;top:50%;transform:translateY(-50%);}


  footer{background:#2E2620;color:#D9CDBE;padding:48px 0 28px;}
  .footer-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;margin-bottom:32px;}
  .footer-top .logo{color:var(--white);}
  .footer-sns{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .footer-sns a{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:20px;border:1px solid rgba(255,255,255,0.2);font-size:13px;line-height:1;text-align:center;white-space:nowrap;}
  .footer-sns a.blog{background:var(--pink);border-color:var(--pink);color:var(--white);font-weight:700;}
  .footer-bottom{border-top:1px solid rgba(255,255,255,0.12);padding-top:20px;font-size:12.5px;color:#9A8E80;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}

  @media(max-width:860px){
    nav{display:none;position:fixed;top:76px;left:0;right:0;background:var(--cream);border-bottom:1px solid var(--border);box-shadow:0 12px 24px rgba(59,50,44,0.08);max-height:calc(100vh - 76px);overflow-y:auto;}
    nav.nav-open{display:block;}
    nav ul{flex-direction:column;gap:0;padding:8px 24px 16px;}
    nav li{width:100%;border-bottom:1px solid var(--border);}
    nav li:last-child{border-bottom:none;}
    nav a{display:block;padding:16px 4px;font-size:15.5px;}
    .nav-toggle{display:block;}
    header .nav-cta{display:none;}
    .section-title{font-size:24px;}
    .gallery-grid{grid-template-columns:repeat(2,1fr);}
    .gallery-grid > div:nth-child(1){grid-column:span 2;grid-row:span 1;height:220px;}
    section{padding:64px 0;}
    .page-hero{padding:140px 0 48px;}
  }
</style>

<script>
  function toggleMobileNav(){
    var nav = document.querySelector('header nav');
    if(nav) nav.classList.toggle('nav-open');
  }
  var PAGE=24, shown=PAGE;
  var cells=[].slice.call(document.querySelectorAll('.gallery-grid > div'));
  function render(){cells.forEach(function(c,i){c.classList.toggle('hidden',i>=shown);});
    var b=document.getElementById('moreBtn'); if(b) b.style.display=shown>=cells.length?'none':'inline-block';}
  function showMore(){shown+=PAGE;render();}
  render();
  var imgs=[].slice.call(document.querySelectorAll('.gallery-grid img')), cur=0;
  var lb=document.createElement('div');lb.className='lightbox';
  lb.innerHTML='<button class="lb-close" aria-label="닫기">×</button><button class="lb-prev" aria-label="이전">‹</button><img alt=""><button class="lb-next" aria-label="다음">›</button>';
  document.body.appendChild(lb);var lbImg=lb.querySelector('img');
  function openLb(i){cur=(i+imgs.length)%imgs.length;lbImg.src=imgs[cur].src;lb.classList.add('open');}
  imgs.forEach(function(im,i){im.parentNode.addEventListener('click',function(){openLb(i);});});
  lb.querySelector('.lb-close').onclick=function(){lb.classList.remove('open');};
  lb.querySelector('.lb-prev').onclick=function(e){e.stopPropagation();openLb(cur-1);};
  lb.querySelector('.lb-next').onclick=function(e){e.stopPropagation();openLb(cur+1);};
  lb.addEventListener('click',function(e){if(e.target===lb)lb.classList.remove('open');});
  document.addEventListener('keydown',function(e){if(!lb.classList.contains('open'))return;if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowLeft')openLb(cur-1);if(e.key==='ArrowRight')openLb(cur+1);});
</script>
