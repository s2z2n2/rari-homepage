<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갤러리 | 라리리듬체조</title>
<style>
  :root{
    --cream:#FFF9F2; --cream-soft:#FBF1E6; --blush:#F6DCD6;
    --gold:#C79A56; --gold-deep:#9C7A3E; --ink:#3B322C; --ink-soft:#7A6E64;
    --white:#FFFFFF; --border:#EFE2D3;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased;}
  img{max-width:100%;display:block;}
  a{text-decoration:none;color:inherit;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 32px;}
  section{padding:96px 0;}

  header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,249,242,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:76px;}
  .logo{font-size:22px;font-weight:700;letter-spacing:1px;color:var(--gold-deep);}
  nav ul{display:flex;gap:36px;list-style:none;}
  nav a{font-size:15px;color:var(--ink);font-weight:500;}
  nav a:hover, nav a.active{color:var(--gold-deep);}
  .nav-cta{background:var(--gold);color:var(--white)!important;padding:10px 22px;border-radius:24px;font-size:14px;font-weight:700;}
  .nav-cta:hover{background:var(--gold-deep);}

  .eyebrow{font-size:13px;letter-spacing:3px;font-weight:700;color:var(--gold-deep);text-transform:uppercase;margin-bottom:14px;}
  .section-title{font-size:32px;font-weight:700;margin-bottom:18px;color:var(--ink);}
  .section-desc{font-size:15.5px;color:var(--ink-soft);max-width:560px;}
  .center{text-align:center;margin-left:auto;margin-right:auto;}

  .page-hero{padding:168px 0 64px;background:linear-gradient(180deg,var(--cream-soft),var(--cream));text-align:center;}

  .gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px;}
  .gallery-grid img{height:220px;object-fit:cover;border-radius:12px;}
  .gallery-grid div:nth-child(1){grid-column:span 2;grid-row:span 2;}
  .gallery-grid div:nth-child(1) img{height:456px;}

  footer{background:#2E2620;color:#D9CDBE;padding:48px 0 28px;}
  .footer-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;margin-bottom:32px;}
  .footer-top .logo{color:var(--white);}
  .footer-sns{display:flex;gap:14px;}
  .footer-sns a{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:14px;}
  .footer-bottom{border-top:1px solid rgba(255,255,255,0.12);padding-top:20px;font-size:12.5px;color:#9A8E80;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}

  @media(max-width:860px){
    nav{display:none;}
    .gallery-grid{grid-template-columns:repeat(2,1fr);}
    .gallery-grid div:nth-child(1){grid-column:span 2;grid-row:span 1;}
    .gallery-grid div:nth-child(1) img{height:220px;}
    section{padding:64px 0;}
    .page-hero{padding:140px 0 48px;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo">라리리듬체조</div>
    <nav>
      <ul>
        <li><a href="about.html">학원소개</a></li>
        <li><a href="program.html">프로그램</a></li>
        <li><a href="branch.html">지점안내</a></li>
        <li><a href="gallery.html" class="active">갤러리</a></li>
        <li><a href="contact.html">문의</a></li>
      </ul>
    </nav>
    <a href="contact.html" class="nav-cta">상담 신청</a>
  </div>
</header>

<section class="page-hero">
  <div class="wrap">
    <div class="eyebrow center">GALLERY</div>
    <h1 class="section-title center">라리의 순간들</h1>
    <p class="section-desc center">수업과 대회 속, 아이들의 성장을 담은 순간들입니다.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="gallery-grid">
      <div><img src="images/hero.jpg" alt="리본 체조 선수"></div>
      <div><img src="images/studio.jpg" alt="스튜디오 전경"></div>
      <div><img src="images/hoop.jpg" alt="후프 훈련"></div>
      <div><img src="images/ball.jpg" alt="볼 훈련"></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="footer-top">
      <div>
        <div class="logo">라리리듬체조</div>
        <p style="margin-top:8px;font-size:13px;color:#9A8E80;">우아함을 배우는 시간, 라리리듬체조</p>
      </div>
      <div class="footer-sns">
        <a href="https://www.instagram.com/rari_rg_korea/" target="_blank" rel="noopener">IG</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© 2026 라리리듬체조. All rights reserved.</span>
      <span>수지점 · 광교점 · 신현점 · 선수반</span>
    </div>
  </div>
</footer>

</body>
</html>
